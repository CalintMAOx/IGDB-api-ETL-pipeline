name: Daily ETL Pipeline

on:
  schedule:
    - cron: '0 1 * * *' # This runs every day at 1:00 AM UTC

  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t igdb-api-etl-pipeline .

      - name: Execute ETL Pipeline
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          docker run --rm \
            -e API_KEY \
            igdb-api-etl-pipeline